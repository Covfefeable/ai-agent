version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: always
    command: minio server /mnt/data --console-address ":9001" --license /minio.license
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./volumes/minio_data:/mnt/data
      - ./minio.license:/minio.license:ro
      - ./volumes/minio_certs:/etc/minio/certs
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./init-minio.sh:/init-minio.sh
    entrypoint: /bin/sh
    command: -c "/init-minio.sh"
    networks:
      - app_network

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

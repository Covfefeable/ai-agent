version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_agent
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@db:5432/ai_agent
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
